name: Build APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Nội dung cập nhật (hiện trong trang Releases)"
        required: false
        default: "Cập nhật Luyện đề master"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      GSERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra khóa ký
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Thiếu secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (xem README.md, bước 2)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm install

      - name: Tạo project Android
        run: npx cap add android

      - name: Icon và splash
        run: npx capacitor-assets generate --android

      - name: Chép mã native (chặn chụp màn hình)
        run: |
          J=android/app/src/main/java/com/luyendemaster/app
          mkdir -p $J
          cp native/MainActivity.java native/ScreenSecurePlugin.java $J/

      - name: Firebase (thông báo đẩy)
        run: |
          if [ -n "$GSERVICES_B64" ]; then
            echo "$GSERVICES_B64" | base64 -d > android/app/google-services.json
            echo "Đã thêm google-services.json"
          else
            echo "::warning::Chưa có GOOGLE_SERVICES_JSON_BASE64 → app build được nhưng chưa nhận thông báo đẩy"
          fi

      - name: Đặt số phiên bản
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Đồng bộ
        run: npx cap sync android

      - name: Build bản release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Ký APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > release.keystore
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out LuyenDeMaster.apk aligned.apk
          $BT/apksigner verify LuyenDeMaster.apk
          rm -f release.keystore

      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Luyện đề master v${{ github.run_number }}
          body: ${{ github.event.inputs.notes }}
          files: LuyenDeMaster.apk
          make_latest: true
